{% extends 'base.html' %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="muted">Enter your account email. If eligible, a one-time reset link will be sent.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="field">
        <label for="reset-email">Email</label>
        <input id="reset-email" type="email" name="email" autocomplete="email" required maxlength="255" />
      </div>
      <button class="primary-btn" type="submit">Send reset link</button>
    </form>
    <div class="auth-link-row"><a href="{{ url_for('auth.login') }}">Back to login</a></div>
  </div>
</div>
{% endblock %}
