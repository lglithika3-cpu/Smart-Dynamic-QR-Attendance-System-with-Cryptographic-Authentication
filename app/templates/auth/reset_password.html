{% extends 'base.html' %}

{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Choose a new password</h1>
    <form method="post">
      {{ form.hidden_tag() }}
      <input type="hidden" name="token" data-reset-token />
      <div class="field">
        {{ form.password.label }}
        {{ form.password(autocomplete='new-password') }}
      </div>
      <div class="field">
        {{ form.confirm_password.label }}
        {{ form.confirm_password(autocomplete='new-password') }}
      </div>
      <button class="primary-btn" type="submit">{{ form.submit.label.text }}</button>
    </form>
  </div>
</div>
{% endblock %}
