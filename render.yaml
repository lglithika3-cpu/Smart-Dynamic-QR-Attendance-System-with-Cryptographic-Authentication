services:
  - type: web
    name: privacy-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && flask --app run.py bootstrap-admin && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 run:app
    healthCheckPath: /attendance/health
    envVars:
      - key: DB_HOST
        value: mysql-308e2af3-lglithika3-02e6.a.aivencloud.com
      - key: DB_PORT
        value: "27887"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: REQUIRED
      - key: DATABASE_SSL_CA
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: QR_SIGNING_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REQUIRE_DATABASE_URL
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
